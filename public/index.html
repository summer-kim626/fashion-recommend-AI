<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의류 맞춤 추천 챗봇 · 로컬</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">

  <!-- ===== 챗봇 화면 ===== -->
  <section class="view chat-view" id="chatView">
    <header class="topbar">
      <div class="topbar-row">
        <div class="bot-info">
          <div class="mark">✦</div>
          <div><div class="bot-name">의류 맞춤 추천 봇</div><div class="status" id="botStatus">내 정보를 읽고 맞춰 답해요</div></div>
        </div>
        <div class="top-actions">
          <button class="reset" id="resetBtn" type="button">대화 초기화</button>
          <button class="admin-btn" id="adminBtn" type="button">관리자</button>
        </div>
      </div>
    </header>

    <div class="profile-bar">
      <div class="profile-inner">
        <span class="profile-label">내 정보</span>
        <div class="ptags" id="ptags"></div>
        <button class="pedit" id="pEditBtn" type="button">정보 설정</button>
        <span class="save-state" id="saveState">불러오는 중…</span>
      </div>
      <form class="profile-form" id="pForm">
        <label class="field">성별
          <select id="pGender"><option value="">선택 안 함</option><option>여성</option><option>남성</option></select>
        </label>
        <label class="field">키 (cm)<input id="pHeight" type="number" inputmode="numeric" min="100" max="230" placeholder="예: 170"></label>
        <label class="field">체중 (kg)<input id="pWeight" type="number" inputmode="numeric" min="25" max="200" placeholder="예: 62"></label>
        <label class="field">연령대
          <select id="pAge"><option value="">선택 안 함</option><option>10대</option><option>20대</option><option>30대</option><option>40대</option><option>50대</option><option>60대 이상</option></select>
        </label>
        <div class="form-error" id="pError"></div>
        <div class="form-actions">
          <button class="btn-ghost" type="button" id="pCancel">취소</button>
          <button class="btn-main" type="submit">저장</button>
        </div>
      </form>
    </div>

    <div class="messages"><div class="inner" id="list"></div></div>
    <footer class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea rows="1" placeholder="사이즈, 코디, 핏, 주문 조회를 물어보세요" id="chatInput"></textarea>
        <button class="send" type="submit" aria-label="보내기" id="sendBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="hint" id="hint">내 정보 + 상품·재고 데이터(가상)를 보고 추천해요 · 주문 조회 예시: MO-20261113-0006 / 강지호</p>
    </footer>
  </section>

  <!-- ===== 관리자 화면 ===== -->
  <section class="view admin" id="adminView" hidden>
    <div class="ad-head">
      <div><div class="ad-title">관리자 페이지</div><div class="ad-store" id="adStore"></div></div>
      <button class="reset" id="adClose" type="button">채팅으로 돌아가기</button>
    </div>
    <div class="ad-login" id="adLogin">
      <form class="ad-card" id="adLoginForm">
        <div class="ad-title">관리자 로그인</div>
        <p class="ad-demo" id="adDemo"></p>
        <input id="adPw" type="password" placeholder="비밀번호" autocomplete="off">
        <div class="ad-pwerr" id="adPwErr"></div>
        <button class="btn-main" type="submit">로그인</button>
      </form>
    </div>
    <div class="ad-body" id="adBody" hidden>
      <div class="ad-toolbar">
        <div class="ad-tabs">
          <button class="ad-tab" data-t="products" type="button">상품</button>
          <button class="ad-tab" data-t="inventory" type="button">재고</button>
          <button class="ad-tab" data-t="orders" type="button">주문</button>
          <button class="ad-tab" data-t="shipping" type="button">배송</button>
          <button class="ad-tab" data-t="prompts" type="button">정책·프롬프트</button>
          <button class="ad-tab" data-t="logs" type="button">대화 기록</button>
          <button class="ad-tab" data-t="guides" type="button">피드백 지침</button>
        </div>
        <span class="ad-count" id="adCount"></span>
        <span class="ad-dirty" id="adDirty" hidden>저장 안 된 변경 있음</span>
        <div class="ad-actions">
          <button class="btn-ghost" id="adAdd" type="button">+ 행 추가</button>
          <button class="btn-ghost" id="adReload" type="button">새로 불러오기</button>
          <button class="btn-ghost" id="adRestore" type="button">초기 데이터 불러오기</button>
          <button class="btn-ghost" id="adLogout" type="button">로그아웃</button>
          <button class="btn-main" id="adApply" type="button">적용</button>
        </div>
      </div>
      <p class="ad-hint" id="adHint"></p>
      <div class="ad-msg" id="adMsg"></div>
      <div class="ad-table-wrap" id="adTableWrap"><table class="ad-table" id="adTable"></table></div>
      <div class="ad-prompts" id="adPrompts" hidden></div>
      <div class="ad-logs" id="adLogs" hidden></div>
    </div>
  </section>
</div>
<script src="common.js"></script>
<script src="chatlog.js"></script>
<script src="chat.js"></script>
<script src="admin-logs.js"></script>
<script src="admin.js"></script>
</body>
</html>
